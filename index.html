<!-- Kaynak Tablo Dropdown -->
<div class="col">
  <label for="sourceSheet">Kaynak Tablo (Source Sheet)</label>
  <select id="sourceSheet" class="form-select">
    <option value="">Yükleniyor...</option>
  </select>
</div>

<!-- Rapor Tablosu Dropdown -->
<div class="col">
  <label for="reportSheet">Rapor Tablosu (Report Sheet)</label>
  <select id="reportSheet" class="form-select">
    <option value="">Yükleniyor...</option>
  </select>
</div>

<script>
  // 1. Sayfa yüklendiğinde Google Sheets listesini getir ve menülere doldur
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const response = await fetch("/api/spreadsheets");
      const data = await response.json();

      if (data.success) {
        const sourceSelect = document.getElementById("sourceSheet");
        const reportSelect = document.getElementById("reportSheet");

        sourceSelect.innerHTML = '<option value="">Kaynak Tablo Seçin</option>';
        reportSelect.innerHTML = '<option value="">Rapor Tablosu Seçin</option>';

        data.spreadsheets.forEach(sheet => {
          // Her tablo için bir <option> oluştur (görünen metin: İsim, değer: ID)
          const optSource = new Option(sheet.name, sheet.id);
          const optReport = new Option(sheet.name, sheet.id);

          sourceSelect.add(optSource);
          reportSelect.add(optReport);
        });
      }
    } catch (err) {
      console.error("Tablolar yüklenirken hata oluştu:", err);
    }
  });

  // 2. "Raporu Güncelle" butonuna basıldığında seçilen verileri backend'e gönder
  async function updateReport() {
    const payload = {
      source_id: document.getElementById("sourceSheet").value,
      report_id: document.getElementById("reportSheet").value,
      lang: document.getElementById("langSelect").value,   // örn: Tümü, TR, EN
      month: document.getElementById("monthSelect").value, // örn: Temmuz
      year: document.getElementById("yearSelect").value    // örn: 2026
    };

    if (!payload.source_id || !payload.report_id) {
      alert("Lütfen hem Kaynak hem de Rapor tablosunu seçin!");
      return;
    }

    const res = await fetch("/api/run-report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await res.json();
    if (result.success) {
      alert("Rapor başarıyla güncellendi!");
    } else {
      alert("Hata: " + result.error);
    }
  }
</script>
